# Ogni ora controlla le aziende e ripubblica il sito su GitHub Pages.
# Prima volta: Settings → Pages → Source: "GitHub Actions" (vedi README).
name: Radar Carriere

on:
  schedule:
    - cron: "17 5-21 * * *"   # ogni ora, dalle 6/7 alle 22/23 italiane (orari GitHub in UTC)
  workflow_dispatch:          # pulsante "Run workflow" per aggiornarlo subito
  push:
    branches: [main]
    paths: ["radar/**", ".github/workflows/sito.yml"]  # es. quando aggiungi un'azienda

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: radar-carriere
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.pubblica.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # L'archivio delle posizioni già viste passa da un giro all'altro tramite la cache di GitHub.
      - name: Recupera l'archivio
        uses: actions/cache/restore@v4
        with:
          path: radar/radar.db
          key: radar-db-${{ github.run_id }}
          restore-keys: radar-db-

      - name: Scansiona le aziende e genera il sito
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          RADAR_PAESI: ${{ vars.RADAR_PAESI }}
          RADAR_ATTIVA: ${{ secrets.ADZUNA_APP_KEY != '' && 'adzuna' || '' }}
        run: python radar/radar.py sito _sito

      - name: Salva l'archivio
        if: always()
        uses: actions/cache/save@v4
        with:
          path: radar/radar.db
          key: radar-db-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sito

      - name: Pubblica su GitHub Pages
        id: pubblica
        uses: actions/deploy-pages@v4
