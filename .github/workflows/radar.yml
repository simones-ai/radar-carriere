# Ogni 20 minuti (dalle 7 alle 23 circa) controlla le aziende e ti manda un'email
# appena esce una posizione nuova. Configurazione: vedi README ("Email").
name: Radar Carriere

on:
  schedule:
    - cron: "7,27,47 5-21 * * *"   # ogni 20 minuti, dalle 6/7 alle 22/23 italiane (orari GitHub in UTC)
  workflow_dispatch:                # pulsante "Run workflow" per un controllo immediato

permissions:
  contents: read

concurrency:
  group: radar-carriere
  cancel-in-progress: false

jobs:
  controlla:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # L'archivio delle posizioni già viste passa da un giro all'altro tramite la cache di GitHub
      # (non è pubblica: la leggono solo i workflow di questo repository).
      - name: Recupera l'archivio
        uses: actions/cache/restore@v4
        with:
          path: radar/radar.db
          key: radar-db-${{ github.run_id }}
          restore-keys: radar-db-

      - name: Controlla le aziende e manda le email
        env:
          EMAIL_UTENTE: ${{ secrets.EMAIL_UTENTE }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_DESTINATARIO: ${{ secrets.EMAIL_DESTINATARIO }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          RADAR_PAESI: ${{ vars.RADAR_PAESI }}
          RADAR_ATTIVA: ${{ secrets.ADZUNA_APP_KEY != '' && 'adzuna' || '' }}
        run: python radar/radar.py scansiona

      - name: Salva l'archivio
        if: always()
        uses: actions/cache/save@v4
        with:
          path: radar/radar.db
          key: radar-db-${{ github.run_id }}
